{{- if not .Values.global.aws.rds.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.database.postgres.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  serviceName: {{ .Values.database.postgres.name }}
  replicas: {{ .Values.database.postgres.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.database.postgres.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.database.postgres.name }}
    spec:
      containers:
      - name: {{ .Values.database.postgres.name }}
        image: {{ .Values.database.postgres.image.repository }}:{{ .Values.database.postgres.image.tag }}
        imagePullPolicy: {{ .Values.database.postgres.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.database.postgres.service.targetPort }}
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: postgres-password
        - name: POSTGRES_DB
          value: {{ .Values.database.postgres.env.POSTGRES_DB }}
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        resources:
          {{- toYaml .Values.database.postgres.resources | nindent 10 }}
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
  {{- if .Values.database.postgres.persistence.enabled }}
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{ .Values.database.postgres.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.database.postgres.name }}
  namespace: {{ .Values.global.namespace }}
spec:
  selector:
    app: {{ .Values.database.postgres.name }}
  ports:
  - port: {{ .Values.database.postgres.service.port }}
    targetPort: {{ .Values.database.postgres.service.targetPort }}
  clusterIP: None
{{- end }}