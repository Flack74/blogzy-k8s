global:
  namespace: blogzy
  domain: blogzy.example.com
  dockerRegistry: docker.io/your-username
  aws:
    region: us-east-1
    rds:
      enabled: true
      endpoint: ""  # Will be set from secrets

backend:
  name: backend
  image:
    repository: blogzy-backend
    tag: latest
    pullPolicy: Always
  replicas: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "300m"
  env:
    FLASK_ENV: production
  service:
    type: ClusterIP
    port: 5000
    targetPort: 5000

frontend:
  name: frontend
  image:
    repository: blogzy-frontend
    tag: latest
    pullPolicy: Always
  replicas: 2
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  service:
    type: ClusterIP
    port: 80
    targetPort: 80

database:
  # Local PostgreSQL deployment (disabled when using AWS RDS)
  postgres:
    enabled: false  # Set to false when using AWS RDS
    name: postgres
    image:
      repository: postgres
      tag: 15-alpine
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    service:
      type: ClusterIP
      port: 5432
      targetPort: 5432
    persistence:
      enabled: true
      size: 1Gi
    env:
      POSTGRES_DB: blogzy
  
  # AWS RDS Configuration
  rds:
    enabled: true  # Set to true when using AWS RDS
    dbName: blogzy
    port: 5432

secrets:
  postgres:
    user: postgres
    password: ""  # Will be set from secrets
  rds:
    user: postgres
    password: ""  # Will be set from secrets
    endpoint: ""  # Will be set from secrets
  backend:
    secretKey: ""  # Will be set from secrets
    jwtSecretKey: ""  # Will be set from secrets

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  tls:
    enabled: true
    secretName: blogzy-tls