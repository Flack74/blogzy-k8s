prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.45.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    port: 9090

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 10.0.3
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
  persistence:
    enabled: true
    size: 5Gi
  service:
    type: ClusterIP
    port: 3000
  admin:
    user: admin
    password: admin
  plugins: "grafana-piechart-panel,grafana-worldmap-panel"
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    host: grafana.blogzy.example.com
    tls:
      enabled: true
      secretName: grafana-tls