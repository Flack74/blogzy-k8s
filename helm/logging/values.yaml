elasticsearch:
  enabled: true
  image:
    repository: docker.elastic.co/elasticsearch/elasticsearch
    tag: 8.9.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  persistence:
    enabled: true
    size: 10Gi
  service:
    type: ClusterIP
    httpPort: 9200
    transportPort: 9300
  env:
    javaOpts: "-Xms512m -Xmx512m"
    xpackSecurityEnabled: "false"

fluentd:
  enabled: true
  image:
    repository: fluent/fluentd-kubernetes-daemonset
    tag: v1.16-debian-elasticsearch7-1
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "200Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "200m"
  env:
    elasticsearchHost: "elasticsearch"
    elasticsearchPort: "9200"
    elasticsearchScheme: "http"

kibana:
  enabled: true
  image:
    repository: docker.elastic.co/kibana/kibana
    tag: 8.9.0
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "500Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  service:
    type: ClusterIP
    port: 5601
  env:
    xpackSecurityEnabled: "false"
  
  ingress:
    enabled: true
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    host: kibana.blogzy.example.com
    tls:
      enabled: true
      secretName: kibana-tls