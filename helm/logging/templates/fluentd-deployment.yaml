{{- if .Values.fluentd.enabled -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd
  namespace: logging
  labels:
    app: fluentd
spec:
  selector:
    matchLabels:
      app: fluentd
  template:
    metadata:
      labels:
        app: fluentd
    spec:
      serviceAccount: fluentd
      serviceAccountName: fluentd
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      containers:
      - name: fluentd
        image: {{ .Values.fluentd.image.repository }}:{{ .Values.fluentd.image.tag }}
        imagePullPolicy: {{ .Values.fluentd.image.pullPolicy }}
        env:
        - name: FLUENT_ELASTICSEARCH_HOST
          value: {{ .Values.fluentd.env.elasticsearchHost | quote }}
        - name: FLUENT_ELASTICSEARCH_PORT
          value: {{ .Values.fluentd.env.elasticsearchPort | quote }}
        - name: FLUENT_ELASTICSEARCH_SCHEME
          value: {{ .Values.fluentd.env.elasticsearchScheme | quote }}
        - name: FLUENTD_SYSTEMD_CONF
          value: disable
        resources:
          {{- toYaml .Values.fluentd.resources | nindent 10 }}
        volumeMounts:
        - name: varlog
          mountPath: /var/log
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: fluentd-config
          mountPath: /fluentd/etc/fluent.conf
          subPath: fluent.conf
      terminationGracePeriodSeconds: 30
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: fluentd-config
        configMap:
          name: fluentd-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentd
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentd
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluentd
subjects:
- kind: ServiceAccount
  name: fluentd
  namespace: logging
{{- end }}