{{- if .Values.kibana.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kibana
  template:
    metadata:
      labels:
        app: kibana
    spec:
      containers:
      - name: kibana
        image: {{ .Values.kibana.image.repository }}:{{ .Values.kibana.image.tag }}
        imagePullPolicy: {{ .Values.kibana.image.pullPolicy }}
        env:
        - name: ELASTICSEARCH_HOSTS
          value: http://elasticsearch:{{ .Values.elasticsearch.service.httpPort }}
        - name: XPACK_SECURITY_ENABLED
          value: {{ .Values.kibana.env.xpackSecurityEnabled }}
        ports:
        - containerPort: 5601
        resources:
          {{- toYaml .Values.kibana.resources | nindent 10 }}
        readinessProbe:
          httpGet:
            path: /api/status
            port: 5601
          initialDelaySeconds: 60
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kibana
  namespace: logging
spec:
  selector:
    app: kibana
  ports:
  - port: {{ .Values.kibana.service.port }}
    targetPort: 5601
  type: {{ .Values.kibana.service.type }}
{{- end }}